<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
    <title>S-TIX</title>
</head>

<body>

    <header class="navbar">
        <div class="container navbar-inner">
            <a href="Home.html" class="logo">S-TIX</a>

            <!-- Checkbox (hidden) -->
            <input type="checkbox" id="menu-toggle">

            <!-- Hamburger -->
            <label for="menu-toggle" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <!-- NAV -->
            <nav>
                <a href="Home.html" class="active">Home</a>
                <a href="Cinema.html">Cinema</a>
                <a href="Movie.html">Movie</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="section">
            <div class="movie">
                <button class="slide-btn prev">❮</button>
                <button class="slide-btn next">❯</button>
                  <!-- CARD 1 -->
                <div class="card" tabindex="0">
                    <img src="Img/Avengers End Game.jpeg" class="poster">
                    <div class="play-btn">▶</div>
                    <iframe class="trailer"
                        src="https://www.youtube.com/embed/TcMBFSGVi1c"
                        title="Avengers Trailer"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>

                <!-- CARD 2 (FIXED) -->
                <div class="card" tabindex="0">
                    <img src="Img/Zootopia 2.jpeg" class="poster">
                    <div class="play-btn">▶</div>
                    <iframe class="trailer"
                        src="https://www.youtube.com/embed/BjkIOU5PhyQ"
                        title="Zootopia 2 Trailer"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>

                <!-- CARD 3 -->
                <div class="card" tabindex="0">
                    <img src="Img/The Conjuring.jpeg" class="poster">
                    <div class="play-btn">▶</div>
                    <iframe class="trailer"
                        src="https://www.youtube.com/embed/k10ETZ41q5o"
                        title="The Conjuring Trailer"
                        frameborder="0"
                        allowfullscreen>
                    </iframe>
                </div>

                <!-- CARD 4 -->
                <div class="card" tabindex="0">
                    <img src="Img/Insidious.jpeg" class="poster">
                    <div class="play-btn">▶</div>
                    <iframe class="trailer"
                        src="https://www.youtube.com/embed/ZuQuOnYnr3Q"
                        title="Insidious Trailer"
                        frameborder="0"
                        allowfullscreen>
                    </iframe>
                </div>

                <!-- CARD 5 -->
                <div class="card" tabindex="0">
                    <img src="Img/Mufasa.jpeg" class="poster">
                    <div class="play-btn">▶</div>
                    <iframe class="trailer"
                        src="https://www.youtube.com/embed/o17MF9vnabg"
                        title="Mufasa Trailer"
                        frameborder="0"
                        allowfullscreen>
                    </iframe>
                </div>

                <!-- CARD 6 -->
                <div class="card" tabindex="0">
                    <img src="Img/Super Mario.jpeg" class="poster">
                    <div class="play-btn">▶</div>
                    <iframe class="trailer"
                        src="https://www.youtube.com/embed/TnGl01FkMMo"
                        title="Super Mario Trailer"
                        frameborder="0"
                        allowfullscreen>
                    </iframe>
                </div>

            </div>
        </section>

        <section class="section">
            <h2>Choose Your Movie</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search your movie">
            </div>
            <div class="slide-wrapper ">
                <div class="sliders">
                    <img src="Img/Avengers End Game.jpeg" alt="Avengers EndGame">
                    <img src="Img/Insidious.jpeg" alt="Insidious">
                    <img src="Img/Mufasa.jpeg" alt="MUfasa">
                    <img src="Img/Super Mario.jpeg" alt="Ne Zha 2">
                    <img src="Img/Zootopia 2.jpeg" alt="Zootopia 2">
                    <img src="Img/The Conjuring.jpeg" alt="The Conjuring">
                </div>
            </div>
        </section>

        <section class="section">
            <h2>Promo</h2>
            <div class="Promo-grids">
                <article class="promo">
                    <h3>Coming Soon</h3>
                </article>
                <article class="promo">
                    <h3>Coming Soon</h3>
                </article>
                <article class="promo">
                    <h3>Coming Soon</h3>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <h1>S-TIX</h1>

            <a href="Home.html">Home</a>

        <p>&copy;S-TIX - Leo | Derrick | Felix </p>

</html>
